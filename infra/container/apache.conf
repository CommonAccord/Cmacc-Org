ServerName localhost
ErrorLog /proc/self/fd/2

<VirtualHost *:8080>
    DocumentRoot /var/www/html
    DirectoryIndex disabled
    DirectoryIndex i.php index.php

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Equivalent to the existing root .htaccess, without per-request overrides.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
