; Preserve legacy syntax and shell-based Perl execution.
short_open_tag = On
disable_functions =
allow_url_include = Off

; The app uses no sessions. Upload progress runs without session_start() and is the
; path of CVE-2026-109619 and CVE-2026-115560 (PHP advisories, October 2026).
session.upload_progress.enabled = Off

; Keep existing diagnostics in container logs rather than rendered documents.
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
date.timezone = UTC
